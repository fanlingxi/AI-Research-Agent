[project]
name = "ai-research-agent"
version = "0.1.0"
description = "AI Research Agent with GraphRAG, built with LangGraph, FastAPI, Streamlit, Qdrant, and Neo4j."
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
